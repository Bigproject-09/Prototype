spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/remote_db_copy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: aivle

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    data:
      redis:
        host: localhost
        port: 6379
        timeout: 2s
    mail:
      host: ${MAIL_HOST:smtp.gmail.com}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:your_email@gmail.com}
      password: ${MAIL_PASSWORD:your_app_password}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

# =========================
# 외부 API (사업자 진위확인)
# =========================
external:
  data-go:
    service-key: 17986d31ec5f9cf3a864ffc5d8cf4420667bfffb4fc4decc025b895f9d2ab2d0
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
# =========================
# 이메일 인증(Redis) 정책
# =========================
auth:
  email:
    code-ttl-seconds: 300      # 인증코드 유효시간(5분)
    verified-ttl-seconds: 3600 # 인증완료 상태 유지(1시간) - 회원가입 완료까지 유지용
    max-attempts: 5            # 코드 검증 시도 횟수 제한

# =========================
# 에러 메시지 출력 (개발용)
# =========================
server:
  error:
    include-message: always
    include-binding-errors: always
