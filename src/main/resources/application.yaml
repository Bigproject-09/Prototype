spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 내 컴퓨터(로컬) DB 연결
    url: jdbc:mysql://localhost:3306/randi_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: aivle

  jpa:
    hibernate:
      # DB와 엔티티 구조가 일치하는지 검사만 수행
      ddl-auto: validate
      # [중요] 자바 필드명 대소문자 그대로 DB 컬럼명을 찾게 하는 설정
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # MySQL 8.0 이상이므로 최신 방언으로 수정
        dialect: org.hibernate.dialect.MySQLDialect

  # =========================
  # Redis 설정 (들여쓰기 수정됨)
  # =========================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  # =========================
  # 이메일 설정 (들여쓰기 수정됨)
  # =========================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # =========================
  # [필수] 대용량 파일 업로드 설정 (추가됨)
  # =========================
  servlet:
    multipart:
      max-file-size: 1GB       # 파일 1개당 최대 1GB
      max-request-size: 1GB    # 요청 전체 최대 1GB

# =========================
# 서버 설정 (타임아웃 & 에러)
# =========================
server:
  # 대용량 처리를 위한 타임아웃 (10분)
  tomcat:
    connection-timeout: 600000
    keep-alive-timeout: 600000
    max-swallow-size: -1

  error:
    include-message: always
    include-binding-errors: always

# =========================
# 외부 API (사업자 진위확인)
# =========================
external:
  data-go:
    service-key: 17986d31ec5f9cf3a864ffc5d8cf4420667bfffb4fc4decc025b895f9d2ab2d0
    base-url: https://api.odcloud.kr/api/nts-businessman/v1

# =========================
# 이메일 인증(Redis) 정책
# =========================
auth:
  email:
    code-ttl-seconds: 300      # 인증코드 유효시간(5분)
    verified-ttl-seconds: 3600 # 인증완료 상태 유지(1시간)
    max-attempts: 5            # 코드 검증 시도 횟수 제한