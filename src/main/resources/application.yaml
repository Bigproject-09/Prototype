spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 내 컴퓨터(로컬) DB 연결
    url: jdbc:mysql://localhost:3306/remote_db_copy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: aivle

  jpa:
    hibernate:
      # DB와 엔티티 구조가 일치하는지 검사만 수행
      ddl-auto: validate

      # [중요] 자바 필드명 대소문자 그대로 DB 컬럼명을 찾게 하는 설정
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # MySQL 8.0 이상이므로 최신 방언으로 수정 (HHH90000026 경고 해결)
        dialect: org.hibernate.dialect.MySQLDialect
external:
  data-go:
    service-key: 17986d31ec5f9cf3a864ffc5d8cf4420667bfffb4fc4decc025b895f9d2ab2d0
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
server:
  error:
    include-message: always
    include-binding-errors: always
